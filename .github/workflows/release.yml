name: Release

# Runs when a Palettes version tag is pushed.
# Example: palettes-v0.1.0.
# A branch push does not run this workflow.
# change-gate runs first. It passes only when Jira has an
# Approved OPS Change whose summary or description contains the tag.
# The release job then builds Palettes-v<version>.zip from the Palettes
# folder and publishes a GitHub release. It uploads that same zip to the
# Palettes CurseForge project. The project id is ## X-Curse-Project-ID in
# Palettes.toc. The token is the CF_API_KEY repository secret. A missing
# token or a placeholder project id fails the upload. There is no Wago upload.

on:
  push:
    tags:
      - "palettes-v*"

permissions:
  contents: read

jobs:
  change-gate:
    name: Approved OPS Change
    runs-on: ubuntu-latest
    outputs:
      issue_key: ${{ steps.require.outputs.issue_key }}
    steps:
      - name: Require an approved OPS Change for this tag
        id: require
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # Fail closed. A missing secret, a Jira error, or no exact tag
          # match exits non-zero, and this workflow fails.
          set -euo pipefail

          if ! command -v curl >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
            echo "curl and jq are required to check the OPS Change. Upload blocked."
            exit 1
          fi

          if [ -z "${JIRA_EMAIL:-}" ] || [ -z "${JIRA_API_TOKEN:-}" ]; then
            echo "Repository secrets JIRA_EMAIL and JIRA_API_TOKEN are required. Upload blocked."
            exit 1
          fi

          if [ -z "${TAG:-}" ]; then
            echo "No approved OPS Change found for tag. Upload blocked."
            exit 1
          fi

          # Jira ~ is fuzzy. The query finds candidates. The jq check below
          # keeps a candidate only when the tag string itself is present.
          jql_tag=$(printf '%s' "$TAG" | sed 's/\\/\\\\/g; s/"/\\"/g')
          jql="project = OPS AND issuetype = Change AND status = Approved AND (summary ~ \"${jql_tag}\" OR description ~ \"${jql_tag}\")"

          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          body="${workdir}/jira.json"
          token=""
          page=0
          matched=0

          while [ "$page" -lt 20 ]; do
            page=$((page + 1))
            if [ -n "$token" ]; then
              payload=$(jq -n \
                --arg jql "$jql" \
                --arg token "$token" \
                '{jql: $jql, maxResults: 50, fields: ["summary", "description"], fieldsByKeys: true, nextPageToken: $token}')
            else
              payload=$(jq -n \
                --arg jql "$jql" \
                '{jql: $jql, maxResults: 50, fields: ["summary", "description"], fieldsByKeys: true}')
            fi

            http_code=$(curl -sS --connect-timeout 10 --max-time 30 \
              -o "$body" -w "%{http_code}" \
              -X POST \
              -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://oddbrew.atlassian.net/rest/api/3/search/jql") || {
              echo "Jira search failed for tag ${TAG}. Upload blocked."
              exit 1
            }

            case "$http_code" in
              2*) ;;
              *)
                detail=$(jq -r '[.errorMessages[]?] | join("; ")' "$body" 2>/dev/null || true)
                if [ -n "$detail" ]; then
                  echo "Jira search failed for tag ${TAG} (HTTP ${http_code}): ${detail}. Upload blocked."
                else
                  echo "Jira search failed for tag ${TAG} (HTTP ${http_code}). Upload blocked."
                fi
                exit 1
                ;;
            esac

            if ! jq -e 'type == "object" and (.issues | type == "array")' "$body" >/dev/null; then
              echo "Jira search returned an unexpected response for tag ${TAG}. Upload blocked."
              exit 1
            fi

            if ! keys=$(jq -r --arg tag "$TAG" '
              def flat:
                [ .. | strings ] | join("\n");
              .issues[]
              | select(
                  ((((.fields // {}).summary // "") | flat) | contains($tag))
                  or
                  ((((.fields // {}).description // "") | flat) | contains($tag))
                )
              | .key // empty
              | select(type == "string" and length > 0)
            ' "$body"); then
              echo "Jira search returned an unexpected response for tag ${TAG}. Upload blocked."
              exit 1
            fi

            if [ -n "$keys" ]; then
              while IFS= read -r key; do
                [ -n "$key" ] || continue
                echo "Approved OPS Change ${key} matches tag ${TAG}."
                # The first key is the issue the release comment uses.
                # Saving it must not change whether this gate passes.
                if [ -z "${issue_key_out:-}" ] && [[ $key =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]]; then
                  issue_key_out=$key
                  if [ -n "${GITHUB_OUTPUT:-}" ]; then
                    echo "issue_key=${key}" >> "$GITHUB_OUTPUT" || true
                  fi
                fi
                matched=1
              done <<< "$keys"
              break
            fi

            is_last=$(jq -r 'if .isLast == true then "true" else "false" end' "$body")
            token=$(jq -r '.nextPageToken // empty' "$body")
            if [ "$is_last" = "true" ] || [ -z "$token" ]; then
              break
            fi
          done

          if [ "$matched" -ne 1 ]; then
            echo "No approved OPS Change found for tag ${TAG}. Upload blocked."
            exit 1
          fi

  release:
    name: GitHub release
    needs: change-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build the release zip
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          ver="${TAG#palettes-v}"
          if [ -z "$ver" ] || [ "$ver" = "$TAG" ]; then
            echo "Tag ${TAG} does not start with palettes-v. Release blocked."
            exit 1
          fi
          # Top level of the zip is the Palettes folder. No docs, tools, or .github.
          zip -r -X "Palettes-v${ver}.zip" Palettes
          unzip -l "Palettes-v${ver}.zip"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          ver="${TAG#palettes-v}"
          gh release create "$TAG" "Palettes-v${ver}.zip" \
            --title "$TAG" \
            --notes-file RELEASE-NOTES.md

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v curl >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
            echo "curl and jq are required. Upload blocked."
            exit 1
          fi
          ver="${TAG#palettes-v}"
          zip="Palettes-v${ver}.zip"
          if [ ! -f "$zip" ] || [ ! -f RELEASE-NOTES.md ] || [ ! -f Palettes/Palettes.toc ]; then
            echo "CurseForge upload is missing the zip, release notes, or toc. Upload blocked."
            exit 1
          fi
          if [ -z "${CF_API_KEY:-}" ]; then
            echo "Repository secret CF_API_KEY is required. Upload blocked."
            exit 1
          fi
          project=$(awk -F: '/^## X-Curse-Project-ID:/ { gsub(/[ \t\r]/, "", $2); print $2; exit }' Palettes/Palettes.toc)
          if ! printf '%s' "$project" | grep -Eq '^[1-9][0-9]+$'; then
            echo "CurseForge project id is missing or still a placeholder (${project:-empty}). Upload blocked."
            exit 1
          fi
          iface=$(awk -F: '/^## Interface:/ { gsub(/[ \t\r]/, "", $2); print $2; exit }' Palettes/Palettes.toc)
          if ! printf '%s' "$iface" | grep -Eq '^[0-9]{5,}$'; then
            echo "TOC Interface line is not a Forever interface number. Upload blocked."
            exit 1
          fi
          # Same split the BigWigs packager uses: 16001 becomes 1.60.1.
          major=$((10#${iface:0:${#iface}-4}))
          minor=$((10#${iface: -4:2}))
          patch=$((10#${iface: -2:2}))
          game_name="${major}.${minor}.${patch}"
          # Forever's CurseForge game version type. The packager uses this for -g forever.
          forever_type=88568
          versions=$(curl -sS --connect-timeout 10 --max-time 30 \
            -H "x-api-token: ${CF_API_KEY}" \
            "https://wow.curseforge.com/api/game/wow/versions") || {
            echo "CurseForge game version list failed. Upload blocked."
            exit 1
          }
          if ! game_id=$(printf '%s' "$versions" | jq -r --arg name "$game_name" --argjson type "$forever_type" '
            if type != "array" then empty
            else first(.[] | select(.gameVersionTypeID == $type and .name == $name) | .id) // empty
            end
          '); then
            echo "CurseForge game version list was not usable. Upload blocked."
            exit 1
          fi
          if ! printf '%s' "$game_id" | grep -Eq '^[1-9][0-9]*$'; then
            echo "CurseForge has no Forever game version ${game_name}. Upload blocked."
            exit 1
          fi
          meta=$(jq -n \
            --rawfile log RELEASE-NOTES.md \
            --arg name "Palettes v${ver}" \
            --argjson gid "$game_id" \
            '{displayName: $name, gameVersions: [$gid], releaseType: "release", changelog: $log, changelogType: "markdown"}')
          code=$(printf '%s' "$meta" | curl -sS --retry 3 --retry-delay 10 \
            -o curseforge-upload.json -w "%{http_code}" \
            -H "x-api-token: ${CF_API_KEY}" \
            -F "metadata=<-" \
            -F "file=@${zip}" \
            "https://wow.curseforge.com/api/projects/${project}/upload-file") || {
            echo "CurseForge upload request failed. Upload blocked."
            exit 1
          }
          if [ "$code" != "200" ]; then
            echo "CurseForge upload failed (HTTP ${code}) for project ${project}. Upload blocked."
            if [ -s curseforge-upload.json ]; then
              jq -c '.' curseforge-upload.json 2>/dev/null || true
            fi
            exit 1
          fi
          echo "CurseForge upload succeeded for project ${project}, Forever ${game_name}."
